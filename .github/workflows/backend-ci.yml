name: CareerForge Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Lint, Migrate and Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: careerforge_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 5000

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: careerforge_ci_dev
      TEST_DB_NAME: careerforge_test_db
      DB_USER: root
      DB_PASSWORD: root

      CLIENT_ORIGIN: http://localhost:5173
      CLIENT_URL: http://localhost:5173

      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100

      LOGIN_RATE_LIMIT_WINDOW_MINUTES: 15
      LOGIN_RATE_LIMIT_MAX_REQUESTS: 100

      REGISTER_RATE_LIMIT_WINDOW_MINUTES: 60
      REGISTER_RATE_LIMIT_MAX_REQUESTS: 100

      FORGOT_PASSWORD_RATE_LIMIT_WINDOW_MINUTES: 60
      FORGOT_PASSWORD_RATE_LIMIT_MAX_REQUESTS: 100

      RESET_PASSWORD_RATE_LIMIT_WINDOW_MINUTES: 15
      RESET_PASSWORD_RATE_LIMIT_MAX_REQUESTS: 100

      EMAIL_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES: 60
      EMAIL_VERIFICATION_RATE_LIMIT_MAX_REQUESTS: 100

      REFRESH_TOKEN_RATE_LIMIT_WINDOW_MINUTES: 15
      REFRESH_TOKEN_RATE_LIMIT_MAX_REQUESTS: 100

      REPORT_RATE_LIMIT_WINDOW_MINUTES: 60
      REPORT_RATE_LIMIT_MAX_REQUESTS: 100

      UPLOAD_RATE_LIMIT_WINDOW_MINUTES: 15
      UPLOAD_RATE_LIMIT_MAX_REQUESTS: 100

      JWT_ACCESS_SECRET: ci_access_secret_for_testing_only_not_production
      JWT_ACCESS_EXPIRES_IN: 15m

      JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only_not_production
      JWT_REFRESH_EXPIRES_IN: 7d

      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: ci-test-key
      CLOUDINARY_API_SECRET: ci-test-secret
      CLOUDINARY_PROFILE_IMAGE_FOLDER: careerforge/ci/profile-images
      CLOUDINARY_RESUME_FOLDER: careerforge/ci/resumes
      CLOUDINARY_COMPANY_LOGO_FOLDER: careerforge/ci/company-logos

      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci-test-user
      SMTP_PASSWORD: ci-test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -proot \
              --silent; then
              echo "MySQL is ready."
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL did not become ready."
          exit 1

      - name: Create development safety database
        run: |
          mysql \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            -proot \
            -e "CREATE DATABASE IF NOT EXISTS careerforge_ci_dev;"

      - name: Run test database migrations
        run: npm run db:migrate:test

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: |
          npm test -- \
            --runTestsByPath \
            $(find src/tests/unit -type f -name "*.test.js" | sort)

      - name: Run integration tests
        run: |
          npm test -- \
            --runTestsByPath \
            $(find src/tests/integration -type f -name "*.test.js" | sort)

      - name: Run full regression suite
        run: npm test